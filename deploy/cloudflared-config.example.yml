# Example cloudflared config for the Arena server.
# Copy to /etc/cloudflared/config.yml and replace the placeholders:
#   <TUNNEL-UUID>      printed by `cloudflared tunnel create arena`
#   arena.example.com  your hostname (must be on a zone in your Cloudflare account)
#
# cloudflared terminates TLS at Cloudflare's edge (players connect with wss://)
# and forwards WebSocket upgrades to the plain ws:// game server over an http origin.

tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: arena.example.com
    service: http://localhost:7777
  # Anything else (other hostnames) gets a 404 instead of reaching the game.
  - service: http_status:404
