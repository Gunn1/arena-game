# Runs the rules tests, exports the game, and publishes the web version on GitHub Pages.
# - Every push to main: test, build web + Linux + Windows, publish the web version.
# - Pull requests: test and build only, nothing is published.
# - Pushing a tag like v0.2.0: also makes a GitHub Release with the Windows and Linux downloads.
# Desktop builds are also attached to each run as the "desktop-builds" artifact.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release tag matches GAME_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "GAME_VERSION := \"${GITHUB_REF_NAME#v}\"" godot/scripts/config.gd || {
            echo "Tag ${GITHUB_REF_NAME} doesn't match GAME_VERSION in godot/scripts/config.gd"; exit 1; }

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot and export templates (checksums verified)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          grep -E " Godot_v${GODOT_VERSION}-stable_(linux\.x86_64\.zip|export_templates\.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # keep only the templates we export with, so the cache stays small
          find templates -type f ! -name version.txt ! -name web_nothreads_release.zip \
            ! -name linux_release.x86_64 ! -name windows_release_x86_64.exe -delete
          rm -f *.zip *.tpz SHA512-SUMS.txt

      - name: Install export templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Rules tests
        run: |
          ~/godot/godot --headless --path godot --import
          ~/godot/godot --headless --path godot -s tests/test_sim.gd
          ~/godot/godot --headless --path godot -s tests/test_predict.gd

      - name: Online test (dedicated server + 2 bot clients)
        run: godot/tests/net_test.sh ~/godot/godot

      - name: Export web, Linux, Linux server and Windows
        run: |
          mkdir -p build/web build/linux build/server build/windows
          ~/godot/godot --headless --path godot --export-release "Web" ../build/web/index.html
          ~/godot/godot --headless --path godot --export-release "Linux" ../build/linux/arena.x86_64
          ~/godot/godot --headless --path godot --export-release "Linux Server" ../build/server/arena-server.x86_64
          ~/godot/godot --headless --path godot --export-release "Windows" ../build/windows/arena.exe
          tools/version_web.sh build/web
          test -f "build/web/arena-$(sed -n 's/^const GAME_VERSION := \"\(.*\)\"/\1/p' godot/scripts/config.gd).wasm" && test -f build/linux/arena.x86_64 && test -f build/server/arena-server.x86_64 && test -f build/windows/arena.exe

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: |
            build/linux/arena.x86_64
            build/server/arena-server.x86_64
            build/windows/arena.exe

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-builds
          path: dl
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dl/linux/arena.x86_64
          (cd dl/linux && zip -q ../../arena-linux.zip arena.x86_64)
          chmod +x dl/server/arena-server.x86_64
          (cd dl/server && zip -q ../../arena-server-linux.zip arena-server.x86_64)
          cp dl/windows/arena.exe arena-windows.exe
          gh release create "${GITHUB_REF_NAME}" arena-windows.exe arena-linux.zip arena-server-linux.zip \
            --repo "${GITHUB_REPOSITORY}" --title "Arena ${GITHUB_REF_NAME}" --generate-notes \
            --notes "Windows: download arena-windows.exe and run it (Windows may warn because it isn't signed: More info -> Run anyway). Linux: unzip arena-linux.zip and run ./arena.x86_64. Browser version: https://gunn1.github.io/arena-game/"
